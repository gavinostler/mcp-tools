[project]
name = "mcp-tools"
version = "0.2.0"
description = "MCP server for AI-assisted Roblox development on Windows: Rojo that stays up and auto-connects, Studio import (meshes, images, audio, video), and Rojo / Studio logs and Studio screenshots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
    "psutil>=5.9; sys_platform == 'win32'",
]

[project.scripts]
mcp-tools = "mcp_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tools"]
